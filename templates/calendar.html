<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rally - Calendar</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="/static/styles.css?v={{ css_version }}" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1>Rally</h1>
        <div class="subtitle">Calendar</div>
    </header>

    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/todo">Tasks</a>
        <a href="/shopping">Shopping</a>
        <a href="/calendar" class="active">Calendar</a>
        <div class="nav-dropdown" id="other-dropdown">
            <button class="nav-dropdown-btn" onclick="toggleOtherDropdown(event)">Other</button>
            <div class="nav-dropdown-content">
                <a href="/dinner-planner">Meal Planner</a>
                <a href="/meal-history">Previous Meals</a>
                <a href="/preparedness">Preparedness</a>
            </div>
        </div>
    </nav>

    <div class="page stack">
        <header class="page-header">
            <div class="page-header-row">
                <h2 id="page-title">Calendar</h2>
                <div class="page-header-actions">
                    <button class="btn btn--quiet" id="btn-refresh-calendars" title="Fetch external calendars now">Refresh</button>
                    <button class="btn" id="btn-add-event">Add Event</button>
                </div>
            </div>
        </header>

        <div class="toolbar">
            <div class="toolbar-group toolbar-group--pair">
                <span class="toolbar-label" id="view-label">View</span>
                <select id="view-select" class="select toolbar-control" aria-labelledby="view-label">
                    <option value="calendar">Calendar</option>
                    <option value="agenda">Agenda</option>
                </select>
            </div>
            <!-- View is the renderer, Range is the slice of time. They were one
                 control, which is why Day and Week both rendered lists: there
                 was no way to say "a week, drawn as a calendar". `Next 30 days`
                 is the old rolling agenda window and exists in Agenda only. -->
            <div class="toolbar-group toolbar-group--pair">
                <span class="toolbar-label" id="range-select-label">Range</span>
                <select id="range-select" class="select toolbar-control" aria-labelledby="range-select-label">
                    <option value="day">Day</option>
                    <option value="week">Week</option>
                    <option value="month">Month</option>
                    <option value="rolling30">Next 30 days</option>
                </select>
            </div>
            <div class="toolbar-group" id="period-group">
                <span class="toolbar-label" id="period-label">Period</span>
                <div class="filter-chips" role="group" aria-labelledby="period-label">
                    <button type="button" class="filter-chip" id="btn-prev">&larr; Prev</button>
                    <button type="button" class="filter-chip" id="btn-today">Today</button>
                    <button type="button" class="filter-chip" id="btn-next">Next &rarr;</button>
                </div>
            </div>
            <div class="toolbar-group">
                <span class="toolbar-label" id="member-label">Who</span>
                <div class="filter-chips" id="filter-member-chips" role="group" aria-labelledby="member-label"></div>
            </div>
            <div class="toolbar-reset">
                <button type="button" class="btn btn--quiet" id="filter-clear">Clear Filters</button>
            </div>
        </div>

        <div id="calendar-notice" class="calendar-notice" style="display:none;"></div>

        <!-- `.list-container` is the shared content-container role every other
             page uses: a column of rows with the standard gap. The agenda is
             literally that, and the month grid sits inside it as one child. -->
        <div class="list-container" id="calendar-view">
            <div class="container-loading-state">Loading calendar...</div>
        </div>

        <div class="calendar-legend" id="calendar-legend"></div>

        <!-- A note about how fresh the data is belongs after the data. Keeping
             it out of the page header is also what keeps the first event above
             the fold on a phone, now that the View selector lives there. -->
        <p class="page-note" id="sync-note"></p>
    </div>

    <!-- Modal for add/edit -->
    <div class="modal-overlay" id="event-modal-overlay">
        <div class="modal-content">
            <h3 id="event-modal-title">Add Event</h3>
            <div class="modal-scroll">
            <div class="modal-body">
                <form id="event-form">
                    <input type="hidden" id="event-id">
                    <input type="hidden" id="event-occurrence-date">
                    <div class="form-group">
                        <label>Event</label>
                        <input type="text" id="event-title" placeholder="Event title" required>
                    </div>
                    <div class="form-group">
                        <label>Notes (optional)</label>
                        <textarea id="event-description" placeholder="Additional details" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Location (optional)</label>
                        <input type="text" id="event-location" placeholder="e.g. Dr. Kim's office">
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="event-all-day">
                            All day
                        </label>
                    </div>
                    <div class="form-group" id="event-timed-group">
                        <label>Starts</label>
                        <input type="datetime-local" id="event-start-time">
                        <label>Ends</label>
                        <input type="datetime-local" id="event-end-time">
                    </div>
                    <div class="form-group" id="event-allday-group" style="display:none;">
                        <label>First day</label>
                        <input type="date" id="event-start-date">
                        <label>Last day</label>
                        <input type="date" id="event-end-date">
                        <small>The last day is included — a one-day event has both the same.</small>
                    </div>
                    <div class="form-group">
                        <label>Repeats</label>
                        <select id="event-repeat">
                            <option value="">Does not repeat</option>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly on this day</option>
                            <option value="biweekly">Every 2 weeks on this day</option>
                            <option value="monthly">Monthly on this date</option>
                            <option value="yearly">Yearly on this date</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Who's involved</label>
                        <div class="weekday-checkboxes" id="event-attendees"></div>
                        <small>Attendees decide who a reminder reaches.</small>
                    </div>
                    <div class="form-group">
                        <label>Remind attendees</label>
                        <select id="event-notify">
                            <option value="">No reminder</option>
                            <option value="10">10 minutes before</option>
                            <option value="30">30 minutes before</option>
                            <option value="60">1 hour before</option>
                            <option value="120">2 hours before</option>
                            <option value="1440">1 day before</option>
                        </select>
                        <small id="event-notify-help">Reminders are sent by Pushover.</small>
                    </div>
                </form>

                <div id="event-scope-group" style="display:none;">
                    <div class="form-group">
                        <label>This event repeats. Apply the change to:</label>
                        <div class="event-scope-prompt">
                            <button type="button" class="btn btn--sm" data-scope="this">This occurrence</button>
                            <button type="button" class="btn btn--sm" data-scope="following">This and following</button>
                            <button type="button" class="btn btn--sm" data-scope="all">All events</button>
                        </div>
                        <small id="event-scope-help"></small>
                    </div>
                </div>

                <div id="event-delete-scope-group" style="display:none;">
                    <div class="form-group">
                        <label>This event repeats. Delete:</label>
                        <div class="event-scope-prompt">
                            <button type="button" class="btn btn--sm" data-delete-scope="this">This occurrence</button>
                            <button type="button" class="btn btn--sm" data-delete-scope="following">This and following</button>
                            <button type="button" class="btn btn--sm" data-delete-scope="all">All events</button>
                        </div>
                        <small id="event-delete-scope-help"></small>
                    </div>
                </div>

                <div class="modal-actions" id="event-modal-actions">
                    <button type="submit" form="event-form" class="btn" id="btn-save-event">Save</button>
                    <button type="button" class="btn btn--secondary" id="btn-cancel-event">Cancel</button>
                    <button type="button" class="btn btn--secondary modal-delete" id="btn-delete-event" style="display:none">Delete</button>
                </div>
            </div>
            </div>
        </div>
    </div>

    <!-- Read-only detail, used for external events and for Notify attendees -->
    <div class="modal-overlay" id="detail-modal-overlay">
        <div class="modal-content">
            <h3 id="detail-modal-title">Event</h3>
            <div class="modal-scroll">
            <div class="modal-body">
                <div id="detail-body"></div>
                <div id="detail-notify-result"></div>
                <div class="modal-actions">
                    <button type="button" class="btn" id="btn-notify-attendees" style="display:none;">Notify attendees</button>
                    <button type="button" class="btn btn--secondary" id="btn-detail-edit" style="display:none;">Edit</button>
                    <button type="button" class="btn btn--secondary" id="btn-close-detail">Close</button>
                </div>
            </div>
            </div>
        </div>
    </div>

    <script src="/static/modal.js?v={{ css_version }}"></script>
    <script>
        // State
        let familyMembers = [];
        let occurrences = [];
        let selectedMembers = new Set();
        /* Two orthogonal choices, not one. `mode` is the renderer — a grid or
           a list — and `range` is how much time it covers. Conflating them is
           what made Day and Week render agenda lists: the dropdown had no way
           to express "a week, drawn as a calendar".

           A phone lands on Calendar + Day: the month grid is reachable but
           "what is happening today" is what you open a calendar on a phone to
           find out. Desktop lands on Month, where the grid has room to be
           useful. Neither is remembered — see the note on init(). */
        const NARROW = '(max-width: 767px)';
        let mode = 'calendar';
        let range = window.matchMedia(NARROW).matches ? 'day' : 'month';
        // The first of the displayed month (month range), the first displayed
        // day (day/week/rolling). One anchor for every range keeps Prev/Next
        // honest.
        let anchor = startOfMonth(new Date());
        let editingEvent = null;      // Full event record while the modal is open
        let editingOccurrence = null; // The occurrence that was clicked
        let detailOccurrence = null;
        // The date the now tick last saw, so it can notice midnight passing.
        let tickDate = todayIso();

        const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const AGENDA_DAYS = 30;
        // Ranges Calendar can draw. `rolling30` is a list-only idea: a grid of
        // 30 arbitrary days starting on a Wednesday is not a calendar.
        const CALENDAR_RANGES = ['day', 'week', 'month'];
        const MINUTES_PER_DAY = 24 * 60;
        // The grid is drawn on a five-minute lattice: both starts and heights
        // snap to it, which is the resolution a calendar is read at anyway.
        const SNAP_MINUTES = 5;
        // A body is never shorter than this, so it always has room for a line
        // of text and a 44px target. At --timegrid-hour: 5.5rem that is exactly
        // 44px, which is why the hour row is that tall.
        const MIN_BODY_MINUTES = 30;
        // ...and a tab never shorter than this, or a one-minute event would
        // have nothing to show at all.
        const MIN_TAB_MINUTES = 5;

        // --- Date helpers. Everything is a local YYYY-MM-DD string; the API
        // speaks the same language, so no timezone maths happens in the browser.

        function startOfMonth(date) {
            return new Date(date.getFullYear(), date.getMonth(), 1);
        }

        function isoDate(date) {
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${date.getFullYear()}-${month}-${day}`;
        }

        function addDays(date, days) {
            const next = new Date(date);
            next.setDate(next.getDate() + days);
            return next;
        }

        function parseIso(value) {
            const [y, m, d] = value.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function todayIso() {
            return isoDate(new Date());
        }

        /* The one place the grid asks what time it is. The now line and the
           opening scroll have to agree to the minute, and two `new Date()`
           calls either side of a render can straddle one. Same clock as
           `todayIso()` and the `is-today` rule: the browser's, which on the
           wall tablet is the family's. */
        function nowMinutes() {
            const now = new Date();
            return now.getHours() * 60 + now.getMinutes();
        }

        /* The Monday on or before the first of the month, so the grid starts
           on a full week. getDay() is Sunday-based; the display is not. */
        /* The week starts Sunday, which is what the family reads a calendar
           as. getDay() is already Sunday-based, so the offset is the day
           number itself. */
        function gridStart(monthStart) {
            return addDays(monthStart, -monthStart.getDay());
        }

        function startOfWeek(date) {
            return addDays(startOfDay(date), -startOfDay(date).getDay());
        }

        function startOfDay(date) {
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
        }

        /* The window every renderer and the fetch agree on. `end` is exclusive.

           Month is the one range whose window depends on the mode: a grid has
           to square itself off, so it draws the 42-day block containing the
           month, while a list has no reason to carry the leading and trailing
           days that block adds. */
        function currentRange() {
            if (range === 'day') {
                const start = startOfDay(anchor);
                return { start, end: addDays(start, 1) };
            }
            if (range === 'week') {
                const start = startOfWeek(anchor);
                return { start, end: addDays(start, 7) };
            }
            if (range === 'rolling30') {
                return { start: startOfDay(anchor), end: addDays(startOfDay(anchor), AGENDA_DAYS) };
            }
            if (mode === 'calendar') {
                const start = gridStart(anchor);
                return { start, end: addDays(start, 42) };
            }
            const start = startOfMonth(anchor);
            return { start, end: new Date(start.getFullYear(), start.getMonth() + 1, 1) };
        }

        /* How many days the window covers. The agenda used to loop a hard-coded
           30 regardless of the view and only rendered fewer days as a side
           effect of the narrower fetch; with real ranges that is a bug waiting
           for a warm cache. */
        function rangeDayCount() {
            const { start, end } = currentRange();
            return Math.round((startOfDay(end) - startOfDay(start)) / 86400000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : text;
            return div.innerHTML;
        }

        // --- API

        async function fetchFamilyMembers() {
            const response = await fetch('/api/family');
            familyMembers = await response.json();
            renderMemberChips();
            renderAttendeeCheckboxes();
            renderLegend();
        }

        async function fetchOccurrences() {
            // `shown`, not `range`: that name is the Range selector's value now.
            const shown = currentRange();
            const params = new URLSearchParams({ start: isoDate(shown.start), end: isoDate(shown.end) });
            selectedMembers.forEach(name => params.append('member', name));
            const response = await fetch(`/api/events?${params.toString()}`);
            if (!response.ok) throw new Error('Failed to load events');
            const data = await response.json();
            occurrences = data.occurrences;
            renderNotice(data.failures || []);
            render();
        }

        function renderNotice(failures) {
            const notice = document.getElementById('calendar-notice');
            if (!failures.length) {
                notice.style.display = 'none';
                return;
            }
            // A feed being down shortens the list; saying which one is the
            // difference between "quiet week" and "Google is unreachable".
            notice.style.display = 'block';
            notice.textContent = `Could not reach: ${failures.join(', ')}. Everything else is shown.`;
        }

        // --- Filters

        function renderMemberChips() {
            const chips = document.getElementById('filter-member-chips');
            chips.innerHTML = familyMembers
                .map(m => `<button type="button" class="filter-chip${selectedMembers.has(m.name) ? ' active' : ''}" data-value="${escapeHtml(m.name)}">${escapeHtml(m.name)}</button>`)
                .join('');
        }

        function renderLegend() {
            const legend = document.getElementById('calendar-legend');
            legend.innerHTML = familyMembers
                .map(m => `<span class="calendar-legend-item"><span class="calendar-dot" style="background:${escapeHtml(m.color)}"></span>${escapeHtml(m.name)}</span>`)
                .join('');
        }

        // --- Rendering

        /* Three renderers over one window. Month is the only range where the
           two modes disagree about the component; Day and Week differ only in
           column count, which is why they are one function. */
        function bodyHtml() {
            // The heading rides with the content rather than the page header,
            // so it stays attached to what it names — in every mode, and in
            // print, where `.page-header-meta` is hidden and a calendar came
            // off the printer with no date on it. It leads the empty state too:
            // "Nothing scheduled this month" needs to say which month.
            // Day names exactly one date, so its title is the place to say
            // that the date is today — in either mode. Agenda reached this by
            // dropping its own day heading, which said the same thing an inch
            // lower; Calendar already marks today structurally, with the
            // `is-today` rule on the day label and the now line, but the two
            // Day views should not disagree about whether they say it in words.
            // Week and Month name a span, and "today" is not a span.
            const marksToday = range === 'day' && isoDate(anchor) === todayIso();
            const title = `<h3 class="calendar-range-title">${escapeHtml(rangeLabel())}`
                + `${marksToday ? ' · Today' : ''}</h3>`;
            const body = mode === 'agenda' ? agendaHtml()
                : range === 'month' ? monthHtml()
                : timeGridHtml();
            return title + body;
        }

        function render() {
            const container = document.getElementById('calendar-view');
            container.innerHTML = bodyHtml();
            container.querySelectorAll('[data-occurrence]').forEach(node => {
                node.addEventListener('click', () => openOccurrence(Number(node.dataset.occurrence)));
            });
            container.querySelectorAll('[data-agenda-date]').forEach(node => {
                node.addEventListener('click', () => {
                    // Tapping a day drills into that day rather than opening a
                    // popover: there is exactly one modal chassis. The mode is
                    // left alone — drilling in from a grid should keep you in
                    // the grid, and from a list, in the list.
                    setRange('day');
                    anchor = parseIso(node.dataset.agendaDate);
                    load();
                });
            });
            scrollGridToOpeningHour();
        }

        function rangeLabel() {
            if (range === 'rolling30') {
                const end = addDays(startOfDay(anchor), AGENDA_DAYS - 1);
                return `${anchor.toLocaleDateString(undefined, { month: 'long', day: 'numeric' })} – ${end.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' })}`;
            }
            if (range === 'day') {
                return startOfDay(anchor).toLocaleDateString(undefined, {
                    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric',
                });
            }
            if (range === 'week') {
                const start = startOfWeek(anchor);
                const end = addDays(start, 6);
                const left = start.toLocaleDateString(undefined, { month: 'long', day: 'numeric' });
                // A week that stays in one month reads "August 9 – 15, 2026";
                // one that straddles repeats the month. Built by hand because
                // toLocaleDateString has no {day, year} format and silently
                // produces "2026 (day: 15)" if you ask for one.
                const right = start.getMonth() === end.getMonth()
                    ? `${end.getDate()}, ${end.getFullYear()}`
                    : end.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
                return `${left} – ${right}`;
            }
            return anchor.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
        }

        function occurrencesOn(dateIso) {
            return occurrences.filter(o => o.dates.includes(dateIso));
        }

        /* A month cell is about 110px wide, so "9:30 AM Standup" truncates to
           "9:30 AM Sta…" — the time survives and the title, which is the part
           that identifies the event, does not. The compact form buys back the
           characters that matter. The agenda and the detail view show the full
           time. */
        function compactTime(label) {
            return label
                .replace(':00', '')
                .replace(' AM', 'a')
                .replace(' PM', 'p');
        }

        function dotFor(occurrence) {
            const color = occurrence.member_color || '';
            return `<span class="calendar-dot"${color ? ` style="background:${escapeHtml(color)}"` : ''}></span>`;
        }

        function monthHtml() {
            const start = gridStart(anchor);
            const today = todayIso();
            const month = anchor.getMonth();

            let html = '<div class="calendar-grid-scroll"><div class="calendar-grid">';
            WEEKDAYS.forEach(day => { html += `<div class="calendar-weekday">${day}</div>`; });

            for (let i = 0; i < 42; i++) {
                const day = addDays(start, i);
                const iso = isoDate(day);
                const classes = ['calendar-day'];
                if (day.getMonth() !== month) classes.push('is-outside');
                if (iso === today) classes.push('is-today');

                const dayEvents = occurrencesOn(iso);
                const shown = dayEvents.slice(0, 3);
                const hidden = dayEvents.length - shown.length;

                html += `<div class="${classes.join(' ')}">`;
                // The day number opens that day's agenda — the same move
                // "+N more" makes, offered on every day rather than only the
                // crowded ones.
                // No dots. They were the phone's whole answer to "who is busy
                // today" back when the cell could not carry event text; now
                // that every row carries a name, a row of dots above the rows
                // says the same thing twice and reads as clutter — worst in a
                // crowded cell, which is exactly where it survived longest.
                html += `<button type="button" class="calendar-day-open" data-agenda-date="${iso}">`
                    + `<span class="calendar-day-number">${day.getDate()}</span></button>`;
                shown.forEach(occurrence => {
                    const index = occurrences.indexOf(occurrence);
                    const label = occurrence.all_day ? '' : `<span class="calendar-event-time">${escapeHtml(compactTime(occurrence.time_label))}</span>`;
                    html += `<button type="button" class="calendar-event${occurrence.editable ? '' : ' is-external'}" data-occurrence="${index}" title="${escapeHtml(occurrence.title)}">${dotFor(occurrence)}${label}<span class="calendar-event-title">${escapeHtml(occurrence.title)}</span></button>`;
                });
                if (hidden > 0) {
                    html += `<button type="button" class="calendar-more" data-agenda-date="${iso}">+${hidden} more</button>`;
                }
                html += '</div>';
            }
            return html + '</div></div>';
        }

        /* --- Time grid (Calendar + Day/Week)

           Day and Week are the same component with one column or seven. The
           grid is what a list cannot be: duration is height and adjacency is
           position, so an overlap is visible rather than something you work
           out by reading two timestamps and subtracting. */

        /* "5:30 PM" → 1050. Times are read back off the server-rendered labels
           rather than derived from the UTC instant, because those labels are
           already in the family's configured zone and the rest of the page
           reads them. Doing the arithmetic in the browser instead would put
           the blocks somewhere the labels beside them disagree with, for
           anybody traveling. */
        function minutesFromLabel(label) {
            const match = /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i.exec((label || '').trim());
            if (!match) return null;
            const hours = (Number(match[1]) % 12) + (match[3].toUpperCase() === 'PM' ? 12 : 0);
            return hours * 60 + Number(match[2]);
        }

        /* The slice of one date an occurrence covers, in minutes from midnight.
           An event crossing midnight runs to the bottom of the first day and
           from the top of the next; drawing it once, on the day it started, is
           how a 9 PM–1 AM shift disappears from tomorrow. */
        function timedSpanOn(occurrence, iso) {
            const isFirst = occurrence.start_date === iso;
            const isLast = occurrence.end_date === iso;
            const start = isFirst ? minutesFromLabel(occurrence.time_label) : 0;
            const end = isLast ? minutesFromLabel(occurrence.end_time_label) : MINUTES_PER_DAY;
            if (start === null || end === null) return null;
            // An event ending at midnight is dated to the following day as
            // well, where it would draw a zero-height sliver at the top of a
            // day it does not really touch.
            if (!isFirst && end <= 0) return null;
            return { start, end: Math.max(end, start) };
        }

        function snapToFive(minutes) {
            return Math.round(minutes / SNAP_MINUTES) * SNAP_MINUTES;
        }

        /* Everything about where a block is painted, decided once.

           Layout and rendering both read this, so the columns are packed
           against the same rectangle that ends up on screen — the two drifting
           apart is what let a floored body sit on top of its neighbor.

           `minutes` is the body: at least MIN_BODY_MINUTES, proportional above
           that. `tabMinutes` is the event's own rounded length, which is what
           the tab reports when the body is bigger than the event. A 28-minute
           event rounds to 30 and is therefore not short — it is drawn as one
           plain block, no tab. */
        function paintGeometry(span) {
            const rounded = Math.max(MIN_TAB_MINUTES, snapToFive(span.end - span.start));
            return {
                start: snapToFive(span.start),
                minutes: Math.max(MIN_BODY_MINUTES, rounded),
                tabMinutes: rounded,
                short: rounded < MIN_BODY_MINUTES,
            };
        }

        /* Side-by-side placement. Overlapping events are clustered
           transitively, then each takes the first column free at its start
           time and every event in the cluster is sized 1/n. Events that merely
           touch — one ending exactly as the next begins — are separate
           clusters and each keeps the full width.

           Packing is done on the **rendered** extent, not the true one. A block
           shorter than the floor is painted taller than it lasts, and packing
           on the true span let that surplus sit on top of the next event and
           cover ~42% of its own title. Measuring what is painted is also what
           makes the answer stable: a 30-minute event covers 38.6 minutes of
           axis on a desktop and 47.1 on a phone, and both now cluster
           correctly. The tab still reports the true duration, so a pair split
           this way reads as "adjacent and both need room", not as a conflict. */
        function layoutColumns(items) {
            const sorted = items
                .map(item => ({ ...item, extentEnd: item.paint.start + item.paint.minutes }))
                .sort((a, b) =>
                    a.paint.start - b.paint.start
                    || b.extentEnd - a.extentEnd
                    || a.occurrence.title.localeCompare(b.occurrence.title));

            let cluster = [];
            let clusterEnd = -1;
            const flush = () => {
                const columnEnds = [];
                cluster.forEach(item => {
                    let index = columnEnds.findIndex(end => end <= item.paint.start);
                    if (index === -1) {
                        index = columnEnds.length;
                        columnEnds.push(0);
                    }
                    columnEnds[index] = item.extentEnd;
                    item.column = index;
                });
                cluster.forEach(item => { item.columns = columnEnds.length; });
                cluster = [];
            };

            sorted.forEach(item => {
                if (cluster.length && item.paint.start >= clusterEnd) {
                    flush();
                    clusterEnd = -1;
                }
                cluster.push(item);
                clusterEnd = cluster.length === 1 ? item.extentEnd : Math.max(clusterEnd, item.extentEnd);
            });
            if (cluster.length) flush();
            return sorted;
        }

        function gridDays() {
            const { start } = currentRange();
            const days = [];
            for (let i = 0; i < rangeDayCount(); i++) days.push(addDays(start, i));
            return days;
        }

        /* The all-day band, pinned above the scrolling hours. A Thu–Sun trip is
           one bar across four columns rather than four disconnected chips,
           which is the only reason the band is worth its vertical space — and
           why it collapses entirely on a week that has none. */
        function allDayBandHtml(days) {
            const isos = days.map(isoDate);
            const bars = [];
            occurrences.forEach((occurrence, index) => {
                if (!occurrence.all_day) return;
                const covered = isos.map((iso, i) => occurrence.dates.includes(iso) ? i : -1).filter(i => i >= 0);
                if (!covered.length) return;
                const first = covered[0];
                const last = covered[covered.length - 1];
                bars.push(
                    `<button type="button" class="calendar-timegrid-allday-event${occurrence.editable ? '' : ' is-external'}"`
                    + ` data-occurrence="${index}" title="${escapeHtml(occurrence.title)}"`
                    + ` style="grid-column: ${first + 1} / ${last + 2}">`
                    + `${dotFor(occurrence)}<span class="calendar-event-title">${escapeHtml(occurrence.title)}</span></button>`
                );
            });
            if (!bars.length) return '';
            return '<div class="calendar-timegrid-allday">'
                + '<div class="calendar-timegrid-gutter-cell">All day</div>'
                + `<div class="calendar-timegrid-allday-track">${bars.join('')}</div>`
                + '</div>';
        }

        function hourGutterHtml() {
            let html = '<div class="calendar-timegrid-gutter">';
            for (let hour = 0; hour < 24; hour++) {
                // Midnight carries no label: the row is the top of the grid and
                // a "12 AM" there reads as a value rather than a boundary.
                const label = hour === 0 ? ''
                    : `${hour % 12 === 0 ? 12 : hour % 12} ${hour < 12 ? 'AM' : 'PM'}`;
                html += `<div class="calendar-timegrid-hour"><span>${label}</span></div>`;
            }
            return html + '</div>';
        }

        function timeGridHtml() {
            const days = gridDays();
            const today = todayIso();

            let head = '<div class="calendar-timegrid-head"><div class="calendar-timegrid-gutter-cell"></div>';
            days.forEach(day => {
                const iso = isoDate(day);
                head += `<div class="calendar-timegrid-daylabel${iso === today ? ' is-today' : ''}">`
                    + `<span class="calendar-timegrid-dayname">${WEEKDAYS[day.getDay()]}</span>`
                    + `<span class="calendar-timegrid-daynum">${day.getDate()}</span></div>`;
            });
            head += '</div>';

            let columns = '';
            days.forEach(day => {
                const iso = isoDate(day);
                const items = [];
                occurrencesOn(iso).forEach(occurrence => {
                    if (occurrence.all_day) return;
                    const span = timedSpanOn(occurrence, iso);
                    if (span) items.push({ occurrence, span, paint: paintGeometry(span) });
                });

                let blocks = '';
                layoutColumns(items).forEach(item => {
                    const index = occurrences.indexOf(item.occurrence);
                    const width = 100 / item.columns;
                    // Member color rides the left edge rather than a dot. A
                    // dot costs 8px plus a gap out of a block that may be 40px
                    // wide in a three-way overlap, and it buys nothing the
                    // edge does not already say.
                    const color = item.occurrence.member_color || '';
                    const paint = item.paint;

                    /* An event under MIN_BODY_MINUTES cannot be drawn to scale
                       and stay usable: at 30 minutes the body is already only
                       44px, which is one line of text and exactly the hit-area
                       floor. So it is drawn as two shapes rather than one — a
                       narrow tab down the left at the event's own rounded
                       length, and a body beside it at the 30-minute minimum.
                       Duration reads off the tab; the words and the tap target
                       live in the body. Together they are exactly the column
                       width, so a short event takes no more room than any
                       other.

                       At or above 30 minutes there is nothing to reconcile:
                       the body is already proportional, so no tab is drawn. */
                    const short = paint.short;
                    const style = `top:${(paint.start / MINUTES_PER_DAY) * 100}%;`
                        + `height:${(paint.minutes / MINUTES_PER_DAY) * 100}%;`
                        + `left:${item.column * width}%;width:${width}%;`
                        + (color && !short ? `border-left-color:${escapeHtml(color)};` : '');
                    const time = item.occurrence.start_date === iso
                        ? item.occurrence.time_label
                        : 'Continues';
                    const label = `<span class="calendar-event-title">${escapeHtml(item.occurrence.title)}</span>`
                        + `<span class="calendar-timegrid-event-time">${escapeHtml(time)}</span>`;
                    // The tab is measured off the hour, not off the button: the
                    // button is the body's 30 minutes, so a percentage of it
                    // would describe the minimum rather than the event.
                    const inner = short
                        ? `<span class="calendar-timegrid-event-tab" style="height:calc(var(--timegrid-hour) * ${(paint.tabMinutes / 60).toFixed(4)})`
                            + `${color ? `;background:${escapeHtml(color)}` : ''}"></span>`
                            + `<span class="calendar-timegrid-event-body">${label}</span>`
                        : label;
                    blocks += `<button type="button" class="calendar-timegrid-event${short ? ' is-short' : ''}${item.occurrence.editable ? '' : ' is-external'}"`
                        + ` data-occurrence="${index}" style="${style}"`
                        + ` title="${escapeHtml(`${time} · ${item.occurrence.title}`)}">`
                        + inner
                        + '</button>';
                });

                columns += `<div class="calendar-timegrid-col${iso === today ? ' is-today' : ''}">${blocks}</div>`;
            });

            /* One line for the whole grid rather than one per column. The
               grid's whole value is a shared vertical axis, so the element
               that names your place on it has to cross every column to be read
               against any of them; stopping at today's edge made it a mark on
               Thursday instead of a time. It is drawn in every displayed
               range, not only the one containing today — on a week three
               months out it is the only reference a 3 PM block has, and which
               column is today's is already said by `is-today`, structurally.

               It cannot live in a column even if it wanted to: those are
               `overflow: hidden` so a late-night block does not paint past the
               bottom of the day, which clips a line at the column edge
               whatever its `left` and `right` say. Still a hairline, never a
               fill — color on this page means a family member. */
            const nowTop = (nowMinutes() / MINUTES_PER_DAY) * 100;
            const nowLine = `<div class="calendar-timegrid-now" style="top:${nowTop}%"></div>`;

            /* The grid opens an hour before the current hour, whatever is on
               it. Where to open is a question about when you are asking, not
               about what the day happens to contain: the rule this replaces
               opened an hour ahead of the day's first event, so every visit
               started around 6 AM and the afternoon — the thing most often
               being asked about, at a tablet you are standing at — was ten
               hours of empty morning away. Hour-aligned rather than exactly
               sixty minutes back, so the top of the viewport is always an hour
               label. Clamped between midnight and 1 AM, where there is nothing
               above it to show. */
            const scrollTo = Math.max(0, (Math.floor(nowMinutes() / 60) - 1) * 60);
            // `--multi` is the many-columns case, which is the only one whose
            // day headings are width-starved. Day has one column and all the
            // room it needs, so it must not inherit the narrow treatment.
            const multi = days.length > 1 ? ' calendar-timegrid--multi' : '';
            return `<div class="calendar-timegrid${multi}" style="--timegrid-cols:${days.length}">`
                + head
                + allDayBandHtml(days)
                + `<div class="calendar-timegrid-scroll" data-scroll-minutes="${scrollTo}">`
                + `<div class="calendar-timegrid-body">${hourGutterHtml()}${columns}${nowLine}</div>`
                + '</div></div>';
        }

        function scrollGridToOpeningHour() {
            const scroller = document.querySelector('.calendar-timegrid-scroll');
            if (!scroller) return;
            const minutes = Number(scroller.dataset.scrollMinutes || 0);
            scroller.scrollTop = scroller.scrollHeight * (minutes / MINUTES_PER_DAY);
        }

        /* Rally's primary device is a tablet on a wall that is never reloaded,
           so now has to keep moving on its own: a line frozen at whenever the
           page happened to load is worse than no line, because it is
           confidently wrong. Five minutes is the lattice the grid is already
           drawn on, so the line lands where a block would. */
        const NOW_TICK_MS = SNAP_MINUTES * 60 * 1000;

        function moveNowLine() {
            const line = document.querySelector('.calendar-timegrid-now');
            if (!line) return;
            line.style.top = `${(nowMinutes() / MINUTES_PER_DAY) * 100}%`;
        }

        function tick() {
            const today = todayIso();
            if (today === tickDate) {
                // The common case, and it moves one style property. Re-rendering
                // every five minutes would throw away an open detail modal and
                // reset the scroll under whoever is reading.
                moveNowLine();
                return;
            }
            /* The date rolled over, and everything that says which day it is
               went stale at once: the line, `is-today`, the Day title. Day
               names exactly one date, so on a tablet nobody touches it has to
               follow the date or it is still showing yesterday at breakfast.
               Week and Month name a span and keep the one they are on. */
            tickDate = today;
            if (range === 'day') anchor = parseIso(today);
            load();
        }

        function agendaHtml() {
            const rows = [];
            const { start: windowStart } = currentRange();
            for (let i = 0; i < rangeDayCount(); i++) {
                const day = addDays(windowStart, i);
                const iso = isoDate(day);
                const dayEvents = occurrencesOn(iso);
                if (!dayEvents.length) continue;  // Empty days are omitted.

                // One day in the window means the range title has already said
                // which day it is; a heading here would repeat it an inch below.
                const heading = day.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
                const headingHtml = range === 'day'
                    ? ''
                    : `<div class="agenda-heading">${escapeHtml(heading)}${iso === todayIso() ? ' · Today' : ''}</div>`;
                let html = `<div class="agenda-day">${headingHtml}`;
                dayEvents.forEach(occurrence => {
                    const index = occurrences.indexOf(occurrence);
                    const time = occurrence.all_day
                        ? 'All day'
                        : (occurrence.start_date === iso ? occurrence.time_label : 'Continues');
                    const who = occurrence.attendees.length ? occurrence.attendees.join(', ') : (occurrence.member || '');
                    html += `
                        <div class="editable-item" data-occurrence="${index}" role="button" tabindex="0">
                            <div class="agenda-time">${escapeHtml(time)}</div>
                            <div class="editable-item-content">
                                <div class="editable-item-title">${dotFor(occurrence)} ${escapeHtml(occurrence.title)}</div>
                                ${occurrence.location ? `<div class="editable-item-description">${escapeHtml(occurrence.location)}</div>` : ''}
                                ${who ? `<div class="assignee-label">${escapeHtml(who)}</div>` : ''}
                            </div>
                        </div>`;
                });
                rows.push(html + '</div>');
            }
            if (!rows.length) {
                // The empty state names the slice you are actually looking at;
                // "this stretch" reads oddly when the stretch is one day.
                const empty = range === 'day' ? 'Nothing scheduled on this day.'
                    : range === 'week' ? 'Nothing scheduled this week.'
                    : range === 'month' ? 'Nothing scheduled this month.'
                    : 'Nothing scheduled in this stretch.';
                return `<div class="container-empty-state">${empty}</div>`;
            }
            return rows.join('');
        }

        // --- Add / edit

        function renderAttendeeCheckboxes() {
            const box = document.getElementById('event-attendees');
            box.innerHTML = familyMembers
                .map(m => `<label class="weekday-label"><input type="checkbox" value="${m.id}"> ${escapeHtml(m.name)}</label>`)
                .join('') || '<small>No family members yet — add one in Settings.</small>';
            box.querySelectorAll('input').forEach(input => {
                input.addEventListener('change', updateNotifyHelp);
            });
        }

        function checkedAttendeeIds() {
            return [...document.querySelectorAll('#event-attendees input:checked')].map(i => Number(i.value));
        }

        /* Naming who a reminder will actually reach, while it is being set. An
           event with a reminder and nobody reachable should say so now, not
           fail silently later. */
        function updateNotifyHelp() {
            const help = document.getElementById('event-notify-help');
            const minutes = document.getElementById('event-notify').value;
            if (!minutes) {
                help.textContent = 'Reminders are sent by Pushover.';
                return;
            }
            const ids = checkedAttendeeIds();
            const chosen = familyMembers.filter(m => ids.includes(m.id));
            const reachable = chosen.filter(m => m.pushover_user_key);
            if (!chosen.length) {
                help.textContent = 'Nobody is on this event yet, so nobody will be reminded.';
            } else if (!reachable.length) {
                help.textContent = `No Pushover key for ${chosen.map(m => m.name).join(', ')} — add one in Settings or nobody will be reminded.`;
            } else {
                help.textContent = `Will notify ${reachable.map(m => m.name).join(', ')}.`;
            }
        }

        function toggleAllDayFields() {
            const allDay = document.getElementById('event-all-day').checked;
            document.getElementById('event-timed-group').style.display = allDay ? 'none' : '';
            document.getElementById('event-allday-group').style.display = allDay ? '' : 'none';
        }

        /* Moving an event to another day means moving it, not restating how
           long it lasts. The end follows the start by whatever gap the two
           already had, so 9–10 AM on the 16th becomes 9–10 AM on the 17th.
           This needs the start the field held *before* the edit, which the
           change event no longer carries — hence remembering it. */
        let previousStart = { timed: '', allDay: '' };

        function rememberStartValues() {
            previousStart = {
                timed: document.getElementById('event-start-time').value,
                allDay: document.getElementById('event-start-date').value
            };
        }

        function shiftTimedEnd() {
            const startField = document.getElementById('event-start-time');
            const endField = document.getElementById('event-end-time');
            const oldStart = previousStart.timed;
            previousStart.timed = startField.value;
            if (!startField.value) return;

            const newStart = new Date(startField.value);
            const priorStart = oldStart ? new Date(oldStart) : null;
            const priorEnd = endField.value ? new Date(endField.value) : null;
            // An hour is the default the Add dialog offers; fall back to it
            // when there is no sane prior span to preserve.
            let duration = 60 * 60 * 1000;
            if (priorStart && priorEnd && priorEnd >= priorStart) {
                duration = priorEnd - priorStart;
            }
            endField.value = localDateTimeValue(new Date(newStart.getTime() + duration));
        }

        function shiftAllDayEnd() {
            const startField = document.getElementById('event-start-date');
            const endField = document.getElementById('event-end-date');
            const oldStart = previousStart.allDay;
            previousStart.allDay = startField.value;
            if (!startField.value) return;

            let span = 0;
            if (oldStart && endField.value) {
                const days = Math.round((parseIso(endField.value) - parseIso(oldStart)) / 86400000);
                if (days >= 0) span = days;
            }
            endField.value = isoDate(addDays(parseIso(startField.value), span));
        }

        function localDateTimeValue(date) {
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${isoDate(date)}T${hours}:${minutes}`;
        }

        function hideDeleteScopePrompt() {
            document.getElementById('event-delete-scope-group').style.display = 'none';
        }

        /* Two visible three-button rows — one that saves, one that deletes —
           is how somebody deletes a series they meant to edit. While the
           delete prompt is up it is the only scope prompt on screen; Cancel
           is the way back out. */
        function showDeleteScopePrompt() {
            const occurrenceDate = document.getElementById('event-occurrence-date').value;
            document.getElementById('event-delete-scope-help').textContent = occurrenceDate
                ? `"This occurrence" and "This and following" are measured from ${occurrenceDate}. Deleting cannot be undone.`
                : 'Deleting cannot be undone.';
            document.getElementById('event-scope-group').style.display = 'none';
            const group = document.getElementById('event-delete-scope-group');
            group.style.display = '';
            // The prompt opens below the fold of a long form, where clicking
            // Delete looks like it did nothing at all.
            group.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        /* Add Event opens on the day you are looking at. Reading Saturday the
           22nd and adding an event means adding it to the 22nd — defaulting to
           today is a silent wrong answer you only notice after saving. Where
           the slice on screen is wider than a day, today is still the obvious
           default as long as it is in that slice; otherwise the slice's first
           day is. */
        function defaultEventDate() {
            const now = new Date();
            if (range === 'day') return isoDate(startOfDay(anchor));
            if (range === 'month') {
                // Measured against the anchored month, not the 42-cell grid:
                // the grid shows a few days either side, and being handed
                // August 31st while reading September is the same wrong answer.
                const sameMonth = now.getFullYear() === anchor.getFullYear()
                    && now.getMonth() === anchor.getMonth();
                return sameMonth ? todayIso() : isoDate(startOfMonth(anchor));
            }
            // Named `shown` — plain `range` is the selector's value now, and
            // shadowing it here would put the two `range ===` tests above in
            // the temporal dead zone of this very declaration.
            const shown = currentRange();
            const today = startOfDay(now);
            if (today >= shown.start && today < shown.end) return todayIso();
            return isoDate(startOfDay(shown.start));
        }

        function openAddEventModal(dateIso) {
            editingEvent = null;
            editingOccurrence = null;
            document.getElementById('event-modal-title').textContent = 'Add Event';
            document.getElementById('event-form').reset();
            document.getElementById('event-id').value = '';
            document.getElementById('event-occurrence-date').value = '';

            const day = dateIso || todayIso();
            document.getElementById('event-start-time').value = `${day}T09:00`;
            document.getElementById('event-end-time').value = `${day}T10:00`;
            document.getElementById('event-start-date').value = day;
            document.getElementById('event-end-date').value = day;

            document.getElementById('btn-delete-event').style.display = 'none';
            document.getElementById('event-scope-group').style.display = 'none';
            document.getElementById('btn-save-event').style.display = '';
            hideDeleteScopePrompt();
            rememberStartValues();
            toggleAllDayFields();
            updateNotifyHelp();
            showModalOverlay('event-modal-overlay');
        }

        async function openEditEventModal(occurrence) {
            const response = await fetch(`/api/events/${occurrence.event_id}`);
            if (!response.ok) { alert('Could not load that event'); return; }
            editingEvent = await response.json();
            editingOccurrence = occurrence;

            document.getElementById('event-modal-title').textContent = 'Edit Event';
            document.getElementById('event-id').value = editingEvent.id;
            document.getElementById('event-occurrence-date').value = occurrence.occurrence_date || '';
            document.getElementById('event-title').value = editingEvent.title;
            document.getElementById('event-description').value = editingEvent.description || '';
            document.getElementById('event-location').value = editingEvent.location || '';
            document.getElementById('event-all-day').checked = editingEvent.all_day;
            document.getElementById('event-notify').value = editingEvent.notify_minutes_before ?? '';

            if (editingEvent.all_day) {
                document.getElementById('event-start-date').value = editingEvent.start;
                document.getElementById('event-end-date').value = editingEvent.end;
            } else {
                document.getElementById('event-start-time').value = editingEvent.start;
                document.getElementById('event-end-time').value = editingEvent.end;
            }
            rememberStartValues();

            document.getElementById('event-repeat').value = repeatFromRrule(editingEvent.rrule);
            document.querySelectorAll('#event-attendees input').forEach(input => {
                input.checked = editingEvent.attendee_ids.includes(Number(input.value));
            });

            document.getElementById('btn-delete-event').style.display = '';
            const recurring = Boolean(editingEvent.rrule);
            document.getElementById('event-scope-group').style.display = recurring ? '' : 'none';
            /* The scope buttons stand in for Save on a series, but Cancel and
               Delete still have to be reachable — hide the one button, not the
               row that carries all three. */
            document.getElementById('btn-save-event').style.display = recurring ? 'none' : '';
            hideDeleteScopePrompt();
            if (recurring) {
                const moved = editingEvent.overrides.filter(o => !o.cancelled).length;
                document.getElementById('event-scope-help').textContent = moved
                    ? `${moved} occurrence(s) have their own changes. "All events" keeps them.`
                    : '';
            }

            toggleAllDayFields();
            updateNotifyHelp();
            showModalOverlay('event-modal-overlay');
        }

        /* The UI speaks Rally's dialect; the API stores RFC 5545. The mapping
           is deliberately small — anything more expressive should be typed as
           an RRULE, not grown into a second recurrence vocabulary. */
        function rruleFor(choice, startIso) {
            const day = parseIso(startIso.slice(0, 10));
            const byday = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'][day.getDay()];
            switch (choice) {
                case 'daily': return 'FREQ=DAILY';
                case 'weekly': return `FREQ=WEEKLY;BYDAY=${byday}`;
                case 'biweekly': return `FREQ=WEEKLY;INTERVAL=2;BYDAY=${byday}`;
                case 'monthly': return `FREQ=MONTHLY;BYMONTHDAY=${day.getDate()}`;
                case 'yearly': return 'FREQ=YEARLY';
                default: return null;
            }
        }

        function repeatFromRrule(rrule) {
            if (!rrule) return '';
            const upper = rrule.toUpperCase();
            if (upper.startsWith('FREQ=DAILY')) return 'daily';
            if (upper.startsWith('FREQ=YEARLY')) return 'yearly';
            if (upper.startsWith('FREQ=MONTHLY')) return 'monthly';
            if (upper.includes('INTERVAL=2')) return 'biweekly';
            if (upper.startsWith('FREQ=WEEKLY')) return 'weekly';
            return '';
        }

        function formPayload() {
            const allDay = document.getElementById('event-all-day').checked;
            const start = allDay
                ? document.getElementById('event-start-date').value
                : document.getElementById('event-start-time').value;
            const end = allDay
                ? document.getElementById('event-end-date').value
                : document.getElementById('event-end-time').value;
            const notify = document.getElementById('event-notify').value;
            return {
                title: document.getElementById('event-title').value.trim(),
                description: document.getElementById('event-description').value.trim() || null,
                location: document.getElementById('event-location').value.trim() || null,
                all_day: allDay,
                start,
                end,
                rrule: rruleFor(document.getElementById('event-repeat').value, start),
                notify_minutes_before: notify ? Number(notify) : null,
                attendee_ids: checkedAttendeeIds()
            };
        }

        async function saveEvent(scope) {
            const payload = formPayload();
            if (!payload.title) return;
            if (!payload.start) { alert('A start date is required'); return; }

            let url = '/api/events';
            let method = 'POST';
            if (editingEvent) {
                const params = new URLSearchParams({ scope: scope || 'all' });
                const occurrenceDate = document.getElementById('event-occurrence-date').value;
                if (scope && scope !== 'all' && occurrenceDate) params.set('occurrence_date', occurrenceDate);
                url = `/api/events/${editingEvent.id}?${params.toString()}`;
                method = 'PUT';
            }

            const response = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                const detail = await response.json().catch(() => ({}));
                alert(detail.detail || 'Failed to save the event');
                return;
            }
            closeEventModal();
            load();
        }

        async function deleteEvent(scope) {
            if (!editingEvent) return;
            const params = new URLSearchParams({ scope });
            const occurrenceDate = document.getElementById('event-occurrence-date').value;
            if (scope !== 'all' && occurrenceDate) params.set('occurrence_date', occurrenceDate);
            const response = await fetch(`/api/events/${editingEvent.id}?${params.toString()}`, { method: 'DELETE' });
            if (!response.ok) { alert('Failed to delete the event'); return; }
            closeEventModal();
            load();
        }

        function closeEventModal() {
            hideModalOverlay('event-modal-overlay');
            document.getElementById('btn-save-event').style.display = '';
            hideDeleteScopePrompt();
            editingEvent = null;
            editingOccurrence = null;
        }

        // --- Detail (external events, and Notify attendees)

        function openOccurrence(index) {
            const occurrence = occurrences[index];
            if (!occurrence) return;
            openDetail(occurrence);
        }

        function openDetail(occurrence) {
            detailOccurrence = occurrence;
            document.getElementById('detail-modal-title').textContent = occurrence.title;
            document.getElementById('detail-notify-result').innerHTML = '';

            const when = occurrence.all_day
                ? (occurrence.start_date === occurrence.end_date ? 'All day' : `All day, ${occurrence.start_date} – ${occurrence.end_date}`)
                : `${occurrence.time_label} – ${occurrence.end_time_label}`;

            const rows = [
                ['When', `${occurrence.start_date} · ${when}`],
                ['Where', occurrence.location || '—'],
                ['Who', occurrence.attendees.length ? occurrence.attendees.join(', ') : (occurrence.member || 'Nobody in particular')],
                ['Calendar', occurrence.calendar_label || occurrence.source],
                ['Notes', occurrence.description || '—']
            ];
            if (occurrence.notify_minutes_before) {
                rows.push(['Reminder', `${occurrence.notify_minutes_before} minutes before`]);
            }
            if (!occurrence.editable) {
                // Answering "why can't I change this?" on the screen where it
                // is asked, rather than by disabling a control silently.
                rows.push(['Read-only', 'This event lives on an external calendar Rally can only read.']);
            }

            document.getElementById('detail-body').innerHTML = rows
                .map(([label, value]) => `<div class="event-detail-row"><span class="event-detail-label">${label}</span><span>${escapeHtml(value)}</span></div>`)
                .join('');

            document.getElementById('btn-detail-edit').style.display = occurrence.editable ? '' : 'none';
            document.getElementById('btn-notify-attendees').style.display =
                occurrence.editable && occurrence.attendees.length ? '' : 'none';
            showModalOverlay('detail-modal-overlay');
        }

        async function notifyAttendees() {
            if (!detailOccurrence || !detailOccurrence.event_id) return;
            const button = document.getElementById('btn-notify-attendees');
            button.disabled = true;
            try {
                const response = await fetch(`/api/events/${detailOccurrence.event_id}/notify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ occurrence_date: detailOccurrence.occurrence_date })
                });
                const data = await response.json();
                const parts = [];
                if (data.sent && data.sent.length) parts.push(`Sent to ${data.sent.join(', ')}.`);
                if (data.skipped && data.skipped.length) parts.push(`No Pushover key for ${data.skipped.join(', ')}.`);
                if (data.failed && data.failed.length) parts.push(`Failed for ${data.failed.join(', ')}.`);
                if (data.error) parts.push(data.error);
                document.getElementById('detail-notify-result').innerHTML =
                    `<div class="notify-result">${escapeHtml(parts.join(' ') || 'Nothing to send.')}</div>`;
            } catch (error) {
                document.getElementById('detail-notify-result').innerHTML =
                    '<div class="notify-result">Could not reach Rally to send that.</div>';
            } finally {
                button.disabled = false;
            }
        }

        // --- Wiring

        async function load() {
            try {
                await fetchOccurrences();
            } catch (error) {
                document.getElementById('calendar-view').innerHTML =
                    '<div class="container-empty-state">Could not load the calendar.</div>';
            }
        }

        /* Prev/Next move by whatever the Range selector says, in both modes. */
        function shift(direction) {
            if (range === 'day') {
                anchor = addDays(startOfDay(anchor), direction);
            } else if (range === 'week') {
                anchor = addDays(startOfWeek(anchor), direction * 7);
            } else if (range === 'rolling30') {
                anchor = addDays(startOfDay(anchor), direction * AGENDA_DAYS);
            } else {
                anchor = new Date(anchor.getFullYear(), anchor.getMonth() + direction, 1);
            }
            load();
        }

        /* The start of the slice of `range` that contains `base`. */
        function anchorFor(base) {
            if (range === 'month') return startOfMonth(base);
            if (range === 'week') return startOfWeek(base);
            return startOfDay(base);
        }

        /* Calendar cannot draw `Next 30 days`, so switching into it falls back
           to Month — the nearest thing a grid offers to a long look ahead. */
        function syncRangeOptions() {
            const select = document.getElementById('range-select');
            const rolling = select.querySelector('option[value="rolling30"]');
            rolling.hidden = mode === 'calendar';
            if (mode === 'calendar' && !CALENDAR_RANGES.includes(range)) range = 'month';
            select.value = range;
        }

        function setRange(next) {
            range = next;
            syncRangeOptions();
        }

        function toggleOtherDropdown(e) {
            e.stopPropagation();
            document.getElementById('other-dropdown').classList.toggle('open');
        }
        document.addEventListener('click', function () {
            document.querySelectorAll('.nav-dropdown').forEach(function (d) {
                d.classList.remove('open');
            });
        });

        // ── External calendar freshness ──
        //
        // External feeds are served from a cache refreshed in the background,
        // so the page renders immediately. The trade is staleness, and the
        // honest thing is to say how stale rather than let somebody wonder why
        // an event they just added upstream is missing.
        function relativeAge(iso) {
            const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
            if (mins < 1) return 'just now';
            if (mins === 1) return '1 minute ago';
            if (mins < 60) return mins + ' minutes ago';
            const hrs = Math.round(mins / 60);
            return hrs === 1 ? '1 hour ago' : hrs + ' hours ago';
        }

        async function loadSyncStatus() {
            const note = document.getElementById('sync-note');
            try {
                const r = await fetch('/api/events/sync/status');
                if (!r.ok) { note.textContent = ''; return; }
                const s = await r.json();
                if (!s.expected) { note.textContent = ''; return; }

                const parts = [];
                if (s.oldest_fetched_at) {
                    parts.push('External calendars updated ' + relativeAge(s.oldest_fetched_at));
                } else {
                    parts.push('External calendars have not synced yet');
                }
                if (s.failing && s.failing.length) {
                    parts.push('showing the last good copy for ' + s.failing.join(', '));
                }
                note.textContent = parts.join(' · ');
            } catch (e) {
                note.textContent = '';
            }
        }

        document.getElementById('btn-refresh-calendars').addEventListener('click', async () => {
            const btn = document.getElementById('btn-refresh-calendars');
            const note = document.getElementById('sync-note');
            btn.disabled = true;
            note.textContent = 'Refreshing external calendars…';
            try {
                await fetch('/api/events/sync', { method: 'POST' });
                await load();
                await loadSyncStatus();
            } catch (e) {
                note.textContent = 'Could not refresh right now — showing the last good copy.';
            } finally {
                btn.disabled = false;
            }
        });

        document.getElementById('btn-add-event').addEventListener('click', () => openAddEventModal(defaultEventDate()));
        document.getElementById('btn-cancel-event').addEventListener('click', closeEventModal);
        document.getElementById('btn-close-detail').addEventListener('click', () => hideModalOverlay('detail-modal-overlay'));
        document.getElementById('btn-notify-attendees').addEventListener('click', notifyAttendees);
        document.getElementById('btn-detail-edit').addEventListener('click', () => {
            hideModalOverlay('detail-modal-overlay');
            if (detailOccurrence) openEditEventModal(detailOccurrence);
        });

        document.getElementById('event-all-day').addEventListener('change', toggleAllDayFields);
        document.getElementById('event-notify').addEventListener('change', updateNotifyHelp);

        document.getElementById('event-start-time').addEventListener('change', shiftTimedEnd);
        document.getElementById('event-start-date').addEventListener('change', shiftAllDayEnd);

        document.getElementById('event-form').addEventListener('submit', (event) => {
            event.preventDefault();
            saveEvent('all');
        });

        // Three buttons rather than a select: a destructive-by-default select
        // is how the wrong scope gets picked.
        document.querySelectorAll('#event-scope-group [data-scope]').forEach(button => {
            button.addEventListener('click', () => saveEvent(button.dataset.scope));
        });

        // A series is deleted by the same three-button prompt that saves one.
        // Typing a scope into a window.prompt() is how the wrong one gets
        // picked, and there is no undo behind this.
        document.getElementById('btn-delete-event').addEventListener('click', () => {
            if (!editingEvent) return;
            if (editingEvent.rrule) {
                showDeleteScopePrompt();
                return;
            }
            if (confirm('Delete this event?')) deleteEvent('all');
        });

        document.querySelectorAll('#event-delete-scope-group [data-delete-scope]').forEach(button => {
            button.addEventListener('click', () => deleteEvent(button.dataset.deleteScope));
        });

        document.getElementById('btn-prev').addEventListener('click', () => shift(-1));
        document.getElementById('btn-next').addEventListener('click', () => shift(1));
        document.getElementById('btn-today').addEventListener('click', () => {
            anchor = anchorFor(new Date());
            load();
        });

        /* Switching the renderer keeps the date you were looking at. Going from
           a week in the grid to a week in the list should hand you the same
           week — the mode is a question about presentation, not about when. */
        document.getElementById('view-select').addEventListener('change', (event) => {
            mode = event.target.value;
            syncRangeOptions();
            anchor = anchorFor(anchor);
            load();
        });

        document.getElementById('range-select').addEventListener('change', (event) => {
            range = event.target.value;
            // Re-anchor to the slice that contains where you already were, so
            // switching Month → Day while looking at August lands on a day in
            // August rather than snapping to the 1st. Switching while looking
            // at the current period lands on today, which is what you want
            // almost every time.
            const now = new Date();
            const inCurrentPeriod =
                anchor.getFullYear() === now.getFullYear() &&
                anchor.getMonth() === now.getMonth();
            anchor = anchorFor(inCurrentPeriod ? now : anchor);
            load();
        });

        document.getElementById('filter-member-chips').addEventListener('click', (event) => {
            const chip = event.target.closest('.filter-chip');
            if (!chip) return;
            const name = chip.dataset.value;
            if (selectedMembers.has(name)) selectedMembers.delete(name); else selectedMembers.add(name);
            chip.classList.toggle('active');
            load();
        });

        document.getElementById('filter-clear').addEventListener('click', () => {
            selectedMembers.clear();
            renderMemberChips();
            load();
        });

        /* Every mode and range is reachable at every width, and nothing here
           overrides the user's choice once the page is up: `NARROW` picks the
           landing view and is not consulted again. A width change mid-session
           is a rotated phone or a dragged window, not a request to be moved to
           a different view.

           Deliberately not persisted. Which calendar you want is a function of
           why you opened it — a remembered Day view is exactly wrong for the
           Sunday planning session that is the main event of the week. */
        (async function init() {
            document.getElementById('view-select').value = mode;
            syncRangeOptions();
            anchor = anchorFor(new Date());
            await fetchFamilyMembers();
            await load();
            // After the calendar is on screen, not before: freshness is a
            // footnote and must never delay the thing it is a footnote about.
            loadSyncStatus();
            // Started once the first grid is up, so the tick never races the
            // fetch it would be redrawing.
            setInterval(tick, NOW_TICK_MS);
        })();
    </script>
</body>
</html>
