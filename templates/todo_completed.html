{% extends "base.html" %}
{% set nav_active = "todo" %}
{% block title %}Tasks{% endblock %}
{% block subtitle %}Task Management{% endblock %}
{% block head %}
<script src="/static/phone_links.js?v={{ css_version }}"></script>
{% endblock %}

{% block content %}
    <div class="page stack">
        <header class="page-header">
            <div class="page-header-row">
                <h2>Tasks</h2>
            </div>
            <div class="page-header-meta">
                <a class="link-quiet" href="/todo">Back to current tasks</a>
            </div>
        </header>

        <div class="toolbar">
            <div class="toolbar-group">
                <span class="toolbar-label" id="assignee-label">Assignee</span>
                <div class="filter-chips" id="filter-assignee-chips" role="group" aria-labelledby="assignee-label">
                    <button type="button" class="filter-chip" data-value="unassigned">Unassigned</button>
                </div>
            </div>
            <div class="toolbar-group">
                <label class="toolbar-label" for="sort-by">Sort</label>
                <select id="sort-by" class="select toolbar-control">
                    <option value="completed-newest">Completion Date (Most Recent)</option>
                    <option value="completed-oldest">Completion Date (Oldest)</option>
                    <option value="due-soonest">Due Date (Soonest)</option>
                    <option value="due-furthest">Due Date (Furthest Out)</option>
                    <option value="assignee">Assignee</option>
                    <option value="newest">Newest First</option>
                    <option value="oldest">Oldest First</option>
                </select>
            </div>
            <div class="toolbar-search">
                <label class="toolbar-label" for="search-input">Search</label>
                <div class="toolbar-search-controls">
                    <input type="text" id="search-input" class="search-input"
                           placeholder="Search completed tasks" autocomplete="off">
                    <button type="button" class="btn btn--secondary" id="search-btn" disabled>Search</button>
                    <button type="button" class="btn btn--quiet" id="search-clear">Clear Search</button>
                </div>
            </div>
            <div class="search-results-count" id="search-results-count" hidden></div>
            <div class="toolbar-reset">
                <button type="button" class="btn btn--quiet" id="filter-clear">Clear Filters</button>
            </div>
        </div>

        <div class="list-container" id="list-container">
            <div class="container-loading-state">Loading completed tasks...</div>
        </div>

        <div class="load-more-container" id="load-more-container" style="display:none;">
            <button type="button" class="btn btn--secondary" id="btn-load-more">Load more</button>
        </div>
    </div>

    <script src="/static/archive_list.js?v={{ css_version }}"></script>
    <script>
        let familyMembers = [];

        // Track selected assignee filter values
        let selectedFilters = new Set();

        async function fetchFamilyMembers() {
            const response = await fetch('/api/family');
            familyMembers = await response.json();
            populateAssigneeDropdown();
        }

        function populateAssigneeDropdown() {
            const chips = document.getElementById('filter-assignee-chips');
            chips.innerHTML = '<button type="button" class="filter-chip" data-value="unassigned">Unassigned</button>';
            familyMembers.forEach(m => {
                chips.innerHTML += `<button type="button" class="filter-chip" data-value="${m.id}">${escapeHtml(m.name)}</button>`;
            });
            // Re-apply active state from selectedFilters
            chips.querySelectorAll('.filter-chip').forEach(chip => {
                if (selectedFilters.has(chip.dataset.value)) {
                    chip.classList.add('active');
                }
            });
        }

        function clearAssigneeChips() {
            selectedFilters.clear();
            document.querySelectorAll('#filter-assignee-chips .filter-chip').forEach(chip => {
                chip.classList.remove('active');
            });
        }

        function getMemberById(id) {
            return familyMembers.find(m => m.id === id);
        }

        // Sorting, filtering, searching and paging all happen server-side: the
        // client only ever holds the pages it has loaded, so it can't sort or
        // filter the full set itself.
        const archive = new ArchiveList({
            endpoint: '/api/todos/completed',
            container: 'list-container',
            noun: ['task', 'tasks'],
            loadingText: 'Loading completed tasks...',
            errorText: 'Could not load completed tasks. Please try again.',
            params: (params) => {
                params.set('sort', document.getElementById('sort-by').value);
                selectedFilters.forEach(value => params.append('assignee', value));
            },
            resetFilters: () => {
                clearAssigneeChips();
                document.getElementById('sort-by').value = 'completed-newest';
            },
            emptyMessage: () => {
                if (archive.searchTerm) return 'No completed tasks match the current search.';
                if (selectedFilters.size > 0) return 'No completed tasks match the current filter.';
                return 'No completed tasks yet. Tasks appear here the day after you finish them.';
            },
            render: renderTodos,
        });

        // Render
        function renderTodos(todos) {
            return todos.map(todo => {
                const dueDateHtml = todo.due_date ? formatDueDate(todo.due_date) : '';
                const completedHtml = formatCompletedDate(todo.completed_at);
                const member = todo.assigned_to ? getMemberById(todo.assigned_to) : null;
                const assigneeHtml = member
                    ? `<span class="assignee-label">— ${escapeHtml(member.name)}</span>`
                    : '';
                const recurringIcon = todo.recurring_todo_id ? '<span class="recurring-indicator">↻</span>' : '';
                return `
                    <div class="editable-item" data-id="${todo.id}">
                        <div class="editable-item-content">
                            <div class="editable-item-title">${escapeHtml(todo.title)} ${recurringIcon} ${assigneeHtml}</div>
                            ${todo.description ? `<div class="editable-item-description">${escapeHtmlWithPhoneLinks(todo.description)}</div>` : ''}
                            ${dueDateHtml}
                            ${completedHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Every task here is finished, so due dates render in their neutral
        // style — no overdue emphasis.
        function formatDueDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr + 'T00:00:00');
            return `<div class="todo-due-date">Due ${formatDayMonth(date)}</div>`;
        }

        function formatCompletedDate(value) {
            if (!value) return '';
            const date = new Date(value.endsWith('Z') || value.includes('+') ? value : value + 'Z');
            if (isNaN(date)) return '';
            return `<div class="todo-completed-date">Completed ${formatDayMonth(date)}</div>`;
        }

        function formatDayMonth(date) {
            const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${dayNames[date.getDay()]}, ${monthNames[date.getMonth()]} ${date.getDate()}`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event handlers
        document.getElementById('filter-assignee-chips').addEventListener('click', (e) => {
            const chip = e.target.closest('.filter-chip');
            if (!chip) return;
            const value = chip.dataset.value;
            if (selectedFilters.has(value)) {
                selectedFilters.delete(value);
                chip.classList.remove('active');
            } else {
                selectedFilters.add(value);
                chip.classList.add('active');
            }
            archive.reload();
        });
        // Clear Filters leaves an active search in place.
        document.getElementById('filter-clear').addEventListener('click', () => {
            clearAssigneeChips();
            archive.reload();
        });
        document.getElementById('sort-by').addEventListener('change', () => archive.reload());

        // Initialize
        fetchFamilyMembers().then(() => archive.reload());

    </script>
{% endblock %}
