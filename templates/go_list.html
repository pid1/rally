{% extends "base.html" %}
{% set nav_active = "preparedness" %}
{% block title %}Go List{% endblock %}
{% block subtitle %}Go List{% endblock %}
{% block head %}
<script src="/static/phone_links.js?v={{ css_version }}"></script>
{% endblock %}

{% block content %}
    <div class="page stack">
        <header class="page-header">
            <div class="page-header-row">
                <h2>Go List</h2>
                <div class="page-header-actions">
                    <button class="btn" id="btn-print">Print</button>
                </div>
            </div>
            <div class="page-header-meta">
                <a class="link-quiet" href="/preparedness">Back to inventory</a>
                <a class="btn btn--quiet" href="/api/preparedness/go-list/export?format=md">Markdown</a>
                <a class="btn btn--quiet" href="/api/preparedness/go-list/export?format=csv">CSV</a>
                <a class="btn btn--quiet" href="/api/preparedness/go-list/export?format=pdf">PDF</a>
            </div>
        </header>

        <p class="page-note" id="summary">Loading…</p>

        <div id="groups-container">
            <div class="container-loading-state">Loading go list…</div>
        </div>
    </div>

    <script>
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : text;
            return div.innerHTML;
        }

        function renderRow(item) {
            const qty = item.quantity ? `<span class="prep-qty"> — ${escapeHtml(item.quantity)}</span>` : '';
            const bits = [];
            if (item.notes) bits.push(escapeHtmlWithPhoneLinks(item.notes));
            if (item.next_refresh_date) bits.push(`Refresh: ${item.next_refresh_date}`);
            const detail = bits.length ? `<div class="prep-notes">${bits.join(' &middot; ')}</div>` : '';
            return `
                <div class="prep-row">
                    <div class="golist-checkbox" aria-hidden="true"></div>
                    <div class="prep-main">
                        <div class="prep-name">${escapeHtml(item.name)}${qty}</div>
                        ${detail}
                    </div>
                </div>`;
        }

        async function load() {
            const r = await fetch('/api/preparedness/go-list');
            const data = r.ok ? await r.json() : { groups: [], total_items: 0, generated_on: '' };

            document.getElementById('summary').textContent =
                `${data.total_items} items across ${data.groups.length} locations · generated ${data.generated_on}`;

            const container = document.getElementById('groups-container');
            if (!data.groups.length) {
                container.innerHTML =
                    '<div class="container-empty-state">Nothing to pack yet. Add items on the Inventory page.</div>';
                return;
            }

            container.innerHTML = data.groups.map(g => `
                <div class="prep-group">
                    <div class="prep-group-header">
                        <h3>${escapeHtml(g.location_name)}</h3>
                        <span class="prep-group-count">${g.items.length} item${g.items.length === 1 ? '' : 's'}</span>
                    </div>
                    ${g.items.map(renderRow).join('')}
                </div>`).join('');
        }

        document.getElementById('btn-print').addEventListener('click', () => window.print());

        load();
    </script>
{% endblock %}
