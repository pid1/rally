<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rally - Go List</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="/static/styles.css?v={{ css_version }}" rel="stylesheet" />
  </head>
  <body>
    <header class="header">
      <h1>Rally</h1>
      <div class="subtitle">Go List</div>
    </header>

    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/todo">Tasks</a>
      <a href="/shopping">Shopping</a>
      <a href="/calendar">Calendar</a>
      <div class="nav-dropdown" id="other-dropdown">
        <button
          class="nav-dropdown-btn active"
          onclick="toggleOtherDropdown(event)"
        >
          Other
        </button>
        <div class="nav-dropdown-content">
          <a href="/dinner-planner">Meal Planner</a>
          <a href="/meal-history">Previous Meals</a>
          <!-- The go list is a view of the inventory reached from it, so
                     the nav marks where you came from rather than going blank
                     for want of an entry of its own. -->
          <a href="/preparedness" class="active">Preparedness</a>
        </div>
      </div>
    </nav>

    <div class="page stack">
      <header class="page-header">
        <div class="page-header-row">
          <h2>Go List</h2>
          <div class="page-header-actions">
            <button class="btn" id="btn-print">Print</button>
          </div>
        </div>
        <div class="page-header-meta">
          <a class="link-quiet" href="/preparedness">Back to inventory</a>
          <a
            class="btn btn--quiet"
            href="/api/preparedness/go-list/export?format=md"
            >Markdown</a
          >
          <a
            class="btn btn--quiet"
            href="/api/preparedness/go-list/export?format=csv"
            >CSV</a
          >
          <a
            class="btn btn--quiet"
            href="/api/preparedness/go-list/export?format=pdf"
            >PDF</a
          >
        </div>
      </header>

      <p class="page-note" id="summary">Loading…</p>

      <div id="groups-container">
        <div class="container-loading-state">Loading go list…</div>
      </div>
    </div>

    <script>
      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text == null ? "" : text;
        return div.innerHTML;
      }

      function renderRow(item) {
        const qty = item.quantity
          ? `<span class="prep-qty"> — ${escapeHtml(item.quantity)}</span>`
          : "";
        const bits = [];
        if (item.notes) bits.push(escapeHtml(item.notes));
        if (item.next_refresh_date)
          bits.push(`Refresh: ${item.next_refresh_date}`);
        const detail = bits.length
          ? `<div class="prep-notes">${bits.join(" &middot; ")}</div>`
          : "";
        return `
                <div class="prep-row">
                    <div class="golist-checkbox" aria-hidden="true"></div>
                    <div class="prep-main">
                        <div class="prep-name">${escapeHtml(item.name)}${qty}</div>
                        ${detail}
                    </div>
                </div>`;
      }

      async function load() {
        const r = await fetch("/api/preparedness/go-list");
        const data = r.ok
          ? await r.json()
          : { groups: [], total_items: 0, generated_on: "" };

        document.getElementById("summary").textContent =
          `${data.total_items} items across ${data.groups.length} locations · generated ${data.generated_on}`;

        const container = document.getElementById("groups-container");
        if (!data.groups.length) {
          container.innerHTML =
            '<div class="container-empty-state">Nothing to pack yet. Add items on the Inventory page.</div>';
          return;
        }

        container.innerHTML = data.groups
          .map(
            (g) => `
                <div class="prep-group">
                    <div class="prep-group-header">
                        <h3>${escapeHtml(g.location_name)}</h3>
                        <span class="prep-group-count">${g.items.length} item${g.items.length === 1 ? "" : "s"}</span>
                    </div>
                    ${g.items.map(renderRow).join("")}
                </div>`,
          )
          .join("");
      }

      document
        .getElementById("btn-print")
        .addEventListener("click", () => window.print());

      // Nav dropdown toggle (for touch devices)
      function toggleOtherDropdown(e) {
        e.stopPropagation();
        document.getElementById("other-dropdown").classList.toggle("open");
      }
      document.addEventListener("click", function () {
        document.querySelectorAll(".nav-dropdown").forEach(function (d) {
          d.classList.remove("open");
        });
      });

      load();
    </script>
  </body>
</html>
