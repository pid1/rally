# Copy to config.toml (gitignored) and fill in your deployment's values.
# configure.py reads it; nothing here is a secret, but it is yours, so it stays
# out of the repository.

# Cloudflare dashboard → your account: the 32-hex id in the URL.
account_id = "0123456789abcdef0123456789abcdef"
# Domain overview → API → Zone ID. The zone must be on this account.
zone_id = "fedcba9876543210fedcba9876543210"
# The public hostname for the MCP server, inside that zone.
hostname = "rally-mcp.example.com"
# Zero Trust → Settings → Team name and domain, e.g. "myteam.cloudflareaccess.com".
team_domain = "myteam.cloudflareaccess.com"
# Exactly the people allowed to sign in: their verified primary GitHub emails.
household_emails = ["parent.one@example.com", "parent.two@example.com"]
# The GitHub OAuth App's client id (not the secret). Optional here: it can
# also be passed as --github-client-id.
github_client_id = ""

# Token connections (Rally → Connections, "Signs in with: Token") whose
# /mcp/c/<id> path skips Cloudflare Access login. Their bearer token is the
# credential, checked by Rally on every request. List an id only after the
# connection exists in Rally, and remove it (then re-run) after revoking it.
token_connection_ids = []
# Addresses besides Anthropic's that may reach /mcp and /mcp/c/* at the edge.
# For an ElevenLabs agent (US workspace), its published egress addresses:
# ["34.67.146.145", "34.59.11.47"]. See rally.connections.IP_PRESETS.
extra_mcp_ips = []
