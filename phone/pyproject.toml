[project]
name = "rally-phone"
version = "0.1.0"
description = "Rally phone assistant: Claude places hands-off outbound calls through an ElevenLabs agent"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[project.scripts]
rally-phone-mcp = "rally_phone.server:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
# Same supply-chain policy as Rally: nothing is installed until it has been
# public for 7 days.
exclude-newer = "7 days"
