name: Tests

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Pinned to a uv release over a week old (supply-chain cooldown),
          # matching the Dockerfile; it understands relative exclude-newer.
          version: "0.13.1"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest --cov=rally --cov-report=term-missing --cov-report=xml

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  # The design-system regression suite drives a real browser, so it needs a
  # Chromium download and runs on its own. tests/visual skips itself in the job
  # above, where Playwright is deliberately not installed.
  visual:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Pinned to a uv release over a week old (supply-chain cooldown),
          # matching the Dockerfile; it understands relative exclude-newer.
          version: "0.13.1"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group visual

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Run visual regression tests
        run: uv run pytest tests/visual -v
