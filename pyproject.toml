[project]
name = "rally"
version = "0.1.0"
description = "Your family command center—coordinate, work hard, and make the most of every day."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "openai>=3.35.1",
    "anthropic>=1.15.0",
    "fastapi[standard]>=0.149.0",
    "requests>=2.34.2",
    "ruff>=0.17.1",
    "sqlalchemy>=2.1.5",
    "pydantic>=2.14.1",
    "jinja2>=3.1.6",
    "icalendar>=7.3.0",
    "markdown-it-py>=4.2.0",
    "recurring-ical-events>=3.8.2",
    "caldav>=3.5.0",
    "fpdf2>=2.8.9",
]

[project.scripts]
seed = "rally.cli:seed"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
# Design-system regression tests. Kept out of `dev` so the ordinary test run
# needs no browser download; tests/visual skips itself when this is absent.
visual = [
    "playwright>=1.64.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app is a src-layout package that runs with src on PYTHONPATH rather than
# being installed, so make `import rally` resolve the same way under pytest.
pythonpath = ["src"]

[tool.coverage.run]
source = ["rally"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.uv]
# sadr: nothing is installed until it has been public for 7 days
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
# sadr: cooldown exception GHSA-6q48-6c7w-9gw2, lift when certifi 2026.10.19 clears the cooldown
certifi = "2026-10-20T02:25:00Z"
# sadr: already merged inside the cooldown
fastapi = "2026-10-19T17:23:00Z"
# sadr: already merged inside the cooldown
websockets = "2026-10-19T16:59:00Z"
# sadr: already merged inside the cooldown
httpcore2 = "2026-10-18T16:30:00Z"
# sadr: already merged inside the cooldown
httpx2 = "2026-10-18T16:30:00Z"
# sadr: already merged inside the cooldown
starlette = "2026-10-18T15:51:00Z"
