[project]
name = "rally"
version = "0.1.0"
description = "Your family command center—coordinate, work hard, and make the most of every day."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "openai>=3.31.0",
    "anthropic>=1.14.0",
    "fastapi[standard]>=0.143.2",
    "requests>=2.34.2",
    "ruff>=0.17.0",
    "sqlalchemy>=2.1.4",
    "pydantic>=2.14.1",
    "jinja2>=3.1.6",
    "icalendar>=7.3.0",
    "markdown-it-py>=4.2.0",
    "recurring-ical-events>=3.8.2",
    "caldav>=3.5.0",
    "fpdf2>=2.8.9",
]

[project.scripts]
seed = "rally.cli:seed"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
# Design-system regression tests. Kept out of `dev` so the ordinary test run
# needs no browser download; tests/visual skips itself when this is absent.
visual = [
    "playwright>=1.64.0",
]

[tool.uv]
# Supply-chain cooldown: only resolve releases that have been public for a
# week, so a hijacked or malicious upload is usually pulled before we see it.
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app is a src-layout package that runs with src on PYTHONPATH rather than
# being installed, so make `import rally` resolve the same way under pytest.
pythonpath = ["src"]

[tool.coverage.run]
source = ["rally"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in argument defaults (FastAPI Depends pattern)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
